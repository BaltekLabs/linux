# /etc/baltek/dte.conf - Baltek DTE configuration

# UI mode: vos (animated circle + LLM) or chat (plain shell)
# Can be overridden at boot with kernel cmdline: baltek_ui=chat
BALTEK_UI_MODE="vos"

# Ollama model to use with the VoiceOS UI
OLLAMA_MODEL="mistral:latest"

# Ollama server (change if running on another host)
OLLAMA_HOST="http://localhost:11434"
