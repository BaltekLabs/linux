# /etc/baltek/hyprland-vos.conf
# Hyprland compositor config for Baltek DTE - kiosk/single-app session.
# This is NOT a general desktop config. It runs VoiceOS fullscreen and
# nothing else. Keep it minimal so there is less to break.

# Use the preferred resolution and refresh rate on every connected output.
# On single-display hardware/VMs this is all that's needed.
monitor = , preferred, auto, 1

# Launch VoiceOS as soon as the compositor is ready.
# Hyprland will pass WAYLAND_DISPLAY and XDG_RUNTIME_DIR to the child.
exec-once = /usr/local/sbin/baltek-vos-app

# ── General ──────────────────────────────────────────────────────────────────
general {
    gaps_in     = 0
    gaps_out    = 0
    border_size = 0
}

# ── Decorations ──────────────────────────────────────────────────────────────
decoration {
    rounding    = 0
    drop_shadow = false
    blur {
        enabled = false
    }
}

# ── Animations ───────────────────────────────────────────────────────────────
animations {
    enabled = false
}

# ── Input ────────────────────────────────────────────────────────────────────
# VoiceOS handles its own keyboard events via pygame/SDL2.
# No mouse/pointer needed for this session.
input {
    kb_layout = us
    follow_mouse = 0
    force_no_accel = true
}

# ── Misc ─────────────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
    # Black background - VoiceOS paints over it anyway
    background_color         = 0xff000000
}

# ── Window rules ─────────────────────────────────────────────────────────────
# VoiceOS runs as a python3 process via pygame/SDL2.
# SDL2 sets the Wayland app_id to "python3" by default.
# Once VoiceOS sets SDL_APP_ID this can be updated to class:^(voiceos)$.
windowrulev2 = fullscreen, class:^(python3)$
windowrulev2 = noborder,   class:^(python3)$
windowrulev2 = noanim,     class:^(python3)$
windowrulev2 = noshadow,   class:^(python3)$
